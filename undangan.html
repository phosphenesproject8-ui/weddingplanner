<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Undangan Pernikahan</title>
<meta name="theme-color" content="#17110e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Jost:wght@300;400;500&family=Pinyon+Script&display=swap">
<style>
  /* Gaya simpel: sampul foto gelap, pita renda ivory, bingkai oval emas, latar bunga gelap, RSVP di renda bundar */
  :root {
    --maroon: #5c0d16; --ivory: #f4ecdd; --gold: #c9a15e; --green: #2f4a2b; --dusty: #c98a93; --blush: #edc6c4; --terra: #a8553a;
    --night: #17110e; --ink: #3a1418; --muted: #7a5f57;
    --f-script: "Pinyon Script", cursive; --f-display: "Cormorant Garamond", Georgia, serif; --f-body: "Jost", system-ui, sans-serif;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--night); color: var(--ink); font: 300 15px/1.6 var(--f-body); -webkit-font-smoothing: antialiased; }
  img { max-width: 100%; display: block; }
  .wrap { max-width: 980px; margin: 0 auto; padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); }
  .script { font-family: var(--f-script); text-transform: none; font-weight: 400; }

  .hero { position: relative; min-height: min(92vh, 760px); display: grid; place-items: center; text-align: center; color: var(--ivory); overflow: hidden; background: var(--night); }
  .hero .bg { position: absolute; inset: 0; background-size: cover; background-position: center 35%; filter: saturate(.85) brightness(.55); transform: scale(1.04); }
  .hero::after { content: ""; position: absolute; inset: 0; background: radial-gradient(ellipse at center, rgba(23,17,14,.15), rgba(23,17,14,.75) 75%), linear-gradient(180deg, rgba(23,17,14,.4), rgba(23,17,14,0) 30%, rgba(23,17,14,.6)); }
  .hero .in { position: relative; z-index: 1; padding-block: 60px 100px; }
  .mono { width: 92px; height: 92px; margin: 0 auto 22px; border: 1px solid rgba(201,161,94,.8); border-radius: 50%; display: grid; place-items: center; font: 400 36px/1 var(--f-script); color: var(--gold); position: relative; }
  .mono::before { content: ""; position: absolute; inset: 5px; border: 1px dashed rgba(201,161,94,.45); border-radius: 50%; }
  .hero .welcome { font: 400 13px/1.4 var(--f-body); letter-spacing: .36em; text-transform: uppercase; opacity: .9; }
  .hero h1 { margin: 10px 0 8px; font: 500 clamp(40px, 8.5vw, 78px)/1.15 var(--f-display); letter-spacing: .04em; text-transform: uppercase; }
  .hero h1 .script { font-size: 1.1em; color: var(--gold); padding: 0 .08em; }
  .hero .date { font: 500 clamp(16px, 2.6vw, 20px)/1.4 var(--f-display); letter-spacing: .3em; text-transform: uppercase; color: var(--blush); }
  .to { margin-top: 26px; display: inline-block; padding: 10px 26px; border-top: 1px solid rgba(201,161,94,.6); border-bottom: 1px solid rgba(201,161,94,.6); }
  .to small { display: block; font-size: 11px; letter-spacing: .3em; text-transform: uppercase; opacity: .8; }
  .to b { font: 500 20px/1.4 var(--f-display); letter-spacing: .06em; }
  .scroll { position: absolute; bottom: 64px; left: 50%; transform: translateX(-50%); z-index: 1; color: var(--gold); font-size: 11px; letter-spacing: .3em; text-transform: uppercase; white-space: nowrap; }

  .lace { height: 46px; background-repeat: repeat-x; background-size: auto 46px; background-position: center; position: relative; z-index: 2; }
  .lace.top { margin-top: -44px; }
  .lace.bottom { transform: scaleY(-1); margin-bottom: -44px; }

  .story { background: var(--ivory); position: relative; padding-block: 50px 130px; }
  .story-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 42px; align-items: center; }
  .story-photo { width: 100%; aspect-ratio: 4 / 5; object-fit: cover; margin-top: -120px; box-shadow: 0 18px 40px rgba(23,17,14,.25); position: relative; z-index: 3; }
  .sec-title { font: 500 clamp(34px, 5vw, 46px)/1.2 var(--f-display); letter-spacing: .04em; text-transform: uppercase; color: var(--maroon); margin: 0 0 14px; }
  .sec-title .script { color: var(--terra); font-size: 1.1em; }
  .story p { margin: 0 0 12px; color: var(--ink); max-width: 46ch; }
  .story .quote { font: italic 500 18px/1.55 var(--f-display); color: var(--muted); border-left: 2px solid var(--gold); padding-left: 14px; margin-top: 18px; }
  .parents { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 18px; }
  .parents div { font-size: 13.5px; color: var(--muted); min-width: 0; }
  .parents b { display: block; font: 400 32px/1.45 var(--f-script); color: var(--maroon); }

  .oval { position: absolute; right: max(8%, 30px); bottom: -150px; z-index: 4; width: clamp(170px, 24vw, 230px); aspect-ratio: 4 / 5; border-radius: 50%; padding: 12px;
    background: conic-gradient(from 20deg, #8c6a2e, #e9cf8e, #b58a45, #f3dfa6, #9a7535, #e2c27c, #8c6a2e);
    box-shadow: 0 14px 30px rgba(0,0,0,.45), inset 0 0 0 2px rgba(255,240,200,.5); }
  .oval::before { content: ""; position: absolute; inset: 4px; border-radius: 50%; border: 3px dotted rgba(90,60,20,.55); }
  .oval img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; position: relative; }

  .event { position: relative; color: var(--ivory); text-align: center; padding-block: 140px 80px; overflow: hidden; background: #1a1411; }
  .event canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .event::after { content: ""; position: absolute; inset: 0; background: radial-gradient(ellipse at center, rgba(23,17,14,.45), rgba(23,17,14,.72)); }
  .event .wrap { position: relative; z-index: 1; }
  .ev-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
  .event h3 { font: 500 clamp(30px, 4.5vw, 40px)/1.2 var(--f-display); letter-spacing: .06em; text-transform: uppercase; margin: 0 0 10px; }
  .event .big { font: 400 19px/1.5 var(--f-body); color: var(--blush); }
  .event .small { font-size: 14px; opacity: .85; margin-top: 10px; }
  .countdown { display: flex; justify-content: center; gap: 26px; margin-top: 44px; }
  .countdown b { display: block; font: 500 38px/1.1 var(--f-display); color: var(--gold); font-variant-numeric: tabular-nums lining-nums; }
  .countdown span { font-size: 10.5px; letter-spacing: .26em; text-transform: uppercase; opacity: .8; }
  .btn-line { display: inline-block; margin-top: 16px; color: var(--ivory); border: 1px solid rgba(244,236,221,.6); border-radius: 999px; padding: 7px 18px; font-size: 12px; letter-spacing: .18em; text-transform: uppercase; text-decoration: none; }
  .btn-line:hover { background: rgba(244,236,221,.12); }

  .rsvp-sec { background: var(--maroon); padding-block: 70px 80px; text-align: center; color: var(--ivory); }
  .doily { width: min(340px, 82vw); aspect-ratio: 1; margin: 0 auto; position: relative; border: 0; background: none; padding: 0; cursor: pointer; display: block; color: var(--maroon); }
  .doily svg { width: 100%; height: 100%; display: block; transition: transform .8s; }
  .doily .label { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
  .doily .label b { font: 500 46px/1.1 var(--f-display); letter-spacing: .06em; }
  .doily .label span { font-size: 12px; letter-spacing: .3em; text-transform: uppercase; border-bottom: 1px solid currentColor; margin: 6px auto 0; padding-bottom: 2px; }
  .doily:hover svg { transform: rotate(10deg); }
  .doily:focus-visible { outline: 2px solid var(--gold); outline-offset: 6px; border-radius: 50%; }
  .rsvp-card { max-width: 520px; margin: 34px auto 0; background: var(--ivory); color: var(--ink); border-radius: 18px; padding: 26px 22px; text-align: left; }
  .rsvp-card h3 { margin: 0 0 14px; font: 500 26px/1.2 var(--f-display); color: var(--maroon); text-transform: uppercase; letter-spacing: .05em; text-align: center; }
  .lbl { display: block; font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); margin-bottom: 5px; font-weight: 500; }
  .field { width: 100%; border: 1px solid #d9c9b0; background: #fffcf7; border-radius: 10px; padding: 10px 12px; font: inherit; color: inherit; }
  .field:focus { outline: none; border-color: var(--maroon); }
  form.rsvp { display: grid; gap: 14px; }
  .radios { display: flex; gap: 8px; flex-wrap: wrap; }
  .radios label { flex: 1 1 110px; border: 1px solid #d9c9b0; border-radius: 999px; padding: 9px 12px; text-align: center; cursor: pointer; background: #fffcf7; }
  .radios input { position: absolute; opacity: 0; pointer-events: none; }
  .radios label:has(input:checked) { background: var(--maroon); border-color: var(--maroon); color: var(--ivory); }
  .radios label:has(input:focus-visible) { outline: 2px solid var(--gold); outline-offset: 2px; }
  .send { border: 0; background: var(--maroon); color: var(--ivory); border-radius: 999px; padding: 12px; font: 500 13px/1 var(--f-body); letter-spacing: .14em; text-transform: uppercase; cursor: pointer; }
  .send:disabled { opacity: .6; }
  .msg { font-size: 13.5px; min-height: 1.2em; color: var(--terra); }

  footer { background: var(--night); color: var(--ivory); text-align: center; padding-block: 50px 60px; }
  footer .thanks { font: 400 48px/1.4 var(--f-script); color: var(--gold); }
  footer p { opacity: .8; max-width: 46ch; margin: 0 auto 10px; font-size: 14px; }

  @media (max-width: 720px) {
    .story { padding-bottom: 170px; }
    .story-grid { grid-template-columns: 1fr; gap: 26px; }
    .story-photo { margin-top: -90px; max-width: 340px; margin-inline: auto; }
    .story-text { text-align: center; }
    .story p { margin-inline: auto; }
    .story .quote { text-align: left; }
    .oval { left: 50%; right: auto; transform: translateX(-50%); bottom: -120px; }
    .ev-grid { grid-template-columns: 1fr; gap: 34px; }
    .event { padding-top: 160px; }
    .hero h1 .nm, .hero h1 .script { display: block; }
    .hero h1 .script { font-size: .8em; line-height: 1; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div id="inv"><section class="hero"><div class="in"><div class="welcome">Memuat undangan…</div></div></section></div>
<script type="module" src="js/undangan.js"></script>
</body>
</html>
